name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install generator toolchain
        run: npm ci
        working-directory: .sdk
      - name: Regenerate SDK from committed inputs
        run: npm run generate
        working-directory: .sdk
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - name: Generator and protocol regression tests
        run: node --test "scripts/*.test.cjs"
      - run: npm test
        working-directory: ts
  synthetic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jwm-dev/MABe-mouser
          ref: 27f495abb2f65435a1445fbb7b2aa859eb0696af
          path: backend-reference
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: npm ci && npm run build
        working-directory: ts
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python -X utf8 -B scripts/create_fixture.py validation/synthetic-data
      - name: Start loopback API and check generated SDK
        run: |
          python -X utf8 -B scripts/serve_api.py --backend backend-reference --data validation/synthetic-data --port 8765 > /tmp/mabe-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/openapi.json > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-sdk.cjs
